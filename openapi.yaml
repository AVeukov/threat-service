openapi: 3.0.0
info:
  title: Information Exchange Service
  description: API для обмена информацией об угрозах.
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /info:
    post:
      summary: Создать запись об угрозе
      operationId: createThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatCreateRequest'
      responses:
        '201':
          description: Запись создана
          headers:
            Location:
              description: Путь к созданной записи
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Угроза с таким MD5 уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /info/{md5}:
    parameters:
      - name: md5
        in: path
        required: true
        description: MD5 файла. Регистр букв не учитывается.
        schema:
          $ref: '#/components/schemas/MD5'
    get:
      summary: Получить информацию об угрозе по MD5
      operationId: getInfoByMd5
      responses:
        '200':
          $ref: '#/components/responses/ThreatOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Заменить информацию о существующей угрозе
      description: MD5 и created_at не меняются. Пропущенные description и severity сбрасываются в пустую строку и unknown соответственно.
      operationId: updateThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/ThreatOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    MD5:
      type: string
      pattern: '^[a-fA-F0-9]{32}$'
      example: d41d8cd98f00b204e9800998ecf8427e
    Name:
      type: string
      minLength: 1
      maxLength: 200
      description: Название угрозы. Крайние пробелы удаляются перед проверкой длины; строка из пробелов недопустима.
      example: Trojan.Win32.Generic
    Description:
      type: string
      nullable: true
      maxLength: 2000
      description: Описание поведения угрозы. Крайние пробелы удаляются перед проверкой длины; null означает пустую строку.
      example: Собирает пароли из браузера.
    Severity:
      type: string
      nullable: true
      enum: [unknown, low, medium, high, critical, '', null]
      default: unknown
      description: Уровень опасности. Пропущенное значение, пустая строка и null означают unknown.
    ThreatCreateRequest:
      type: object
      additionalProperties: false
      required: [md5, name]
      properties:
        md5:
          $ref: '#/components/schemas/MD5'
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
        severity:
          $ref: '#/components/schemas/Severity'
    ThreatUpdateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        description:
          $ref: '#/components/schemas/Description'
        severity:
          $ref: '#/components/schemas/Severity'
    ThreatResponse:
      type: object
      required: [md5, name, description, severity, created_at, updated_at]
      properties:
        md5:
          $ref: '#/components/schemas/MD5'
        name:
          $ref: '#/components/schemas/Name'
        description:
          type: string
          maxLength: 2000
        severity:
          type: string
          enum: [unknown, low, medium, high, critical]
        created_at:
          type: string
          format: date-time
          description: Время создания в UTC, задаётся сервером.
        updated_at:
          type: string
          format: date-time
          description: Время последнего обновления в UTC, задаётся сервером.
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Threat not found
        details:
          type: string
  responses:
    ThreatOK:
      description: Информация об угрозе
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ThreatResponse'
    BadRequest:
      description: Некорректный MD5, JSON или поля; тело больше 1 МиБ; Content-Type отличается от application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Угроза с указанным MD5 не найдена
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
